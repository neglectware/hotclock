# The directories of architecture 5.1.
d /var/lib/hotclock            0750 hotclock hotclock -
d /var/lib/hotclock/media      0750 hotclock hotclock -
d /var/lib/hotclock/inbox      0770 hotclock hotclock -
d /var/lib/hotclock/upload-tmp 0750 hotclock hotclock -
d /var/lib/hotclock/backup     0750 hotclock hotclock -
d /var/lib/hotclock/stations   0750 hotclock hotclock -
# Where the Stations page keeps the data of a station deleted with "keep its data" (<name>-<date>-<time>/).
d /var/lib/hotclock/archive    0750 hotclock hotclock -
# The Settings page (architecture 9) writes the configuration files as user `hotclock`: the directories and the
# files belong to root with group `hotclock` and mode 775/664, so the service can replace a file (a rename in its
# directory) and nobody else can write them. /etc/hotclock/secrets.toml is not touched here (mode 0600).
d /etc/hotclock                0775 root     hotclock -
d /etc/hotclock/stations       0775 root     hotclock -
z /etc/hotclock/hotclock.toml  0664 root     hotclock -
z /etc/hotclock/stations/*.toml 0664 root    hotclock -
