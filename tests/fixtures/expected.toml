# Expected markers and facts for the synthetic fixtures (`cargo run -p fixtures`), written BY HAND
# from the signal definitions in crates/fixtures/src/lib.rs, never from running the analyzer.
# Times are milliseconds from the start of the file. `tol_ms` is the tolerance the M1.3 test uses
# for that field (M1.3 acceptance 1: cue_in, cue_out and attack within 20 ms, segue within 50 ms
# where a value is given exactly; `segue_range_ms` where the exact value depends on the K-weighted
# loudness integral and has only been estimated).
#
# STATUS: the *_ms values derived from the signal timeline (start of sound, end of sound, the
# pickup step, the hit) are exact. The `segue` values of the faded and noisy fixtures are
# estimates from the fade law and an assumed integrated loudness, given as ranges. The M1.3 builder
# should tighten those ranges by computing the loudness integral analytically from the signal
# definition (or an independent tool such as `ffmpeg -af ebur128`), and record the change here.
#
# Rules used, from architecture 3.1 and 3.2:
#   cue_in  = first sound - 20 ms (floored at 0);   cue_out = last sound + 50 ms (capped at the end)
#   attack  = first 50 ms RMS window within 8 dB of the 95th-percentile level
#   segue   = last 200 ms K-weighted window at or above (integrated loudness - 12 LU)
#   cold_start: attack - cue_in < 150 ms;  cold_end: cue_out - segue < 300 ms

[tone_fade]
# 0.5 s silence, 20 s 1 kHz at -14 dBFS RMS, 5 s linear fade, 1 s silence
duration_ms = 26500
first_sound_ms = 500
cue_in_ms = 480
attack_ms = 500
attack_tol_ms = 20
cue_out_ms = 25440          # CORRECTED in M1.3 from 25490. The silence threshold is S = L_int - 36 = -11.38 - 36 = -47.4 dBFS
                            # (L_int from ffmpeg -af ebur128), not -52: the linear fade reaches -47.4 dBFS (-33.4 dB below the
                            # -14 dBFS body, amplitude ratio 0.0214) 107 ms before 25.5 s, the last 10 ms window at or above it
                            # ends at 25.39 s, plus the 50 ms pad = 25.44 s
segue_range_ms = [24100, 24500]
flags = ["cold_start"]
not_flags = ["cold_end", "long_tail", "long_intro", "short"]
loudness_lufs_estimate = -10.8   # two equal channels; only the 20 s body and part of the fade pass the gate

[cold_start]
# 1 kHz -14 dBFS RMS from sample 0 for 10 s, then a 3 s linear fade
duration_ms = 13000
cue_in_ms = 0
attack_range_ms = [0, 50]
cue_out_ms = 13000
segue_range_ms = [12100, 12400]
flags = ["cold_start"]

[pickup]
# 0.3 s silence, 500 Hz -32 dBFS 1.5 s, 500 Hz -14 dBFS 15 s, cold stop at 16.8 s
duration_ms = 16800
first_sound_ms = 300
cue_in_ms = 280
attack_ms = 1800            # the -32 to -14 step: 0.3 s + 1.5 s
attack_tol_ms = 20
cue_out_ms = 16800
segue_range_ms = [16600, 16800]   # last complete 200 ms window ends at the file end
flags = ["cold_end"]
not_flags = ["cold_start", "long_intro"]

[cold_end]
# 0.2 s silence, pink noise -16 dBFS RMS 12 s, cold stop at 12.2 s, 0.8 s silence
duration_ms = 13000
first_sound_ms = 200
cue_in_ms = 180
attack_range_ms = [200, 300]
cue_out_ms = 12250
segue_range_ms = [12000, 12250]
flags = ["cold_start", "cold_end"]

[long_tail]
# pink noise -16 dBFS RMS 20 s, then an exponential decay of 40 dB over 30 s
duration_ms = 50000
cue_in_ms = 0
attack_range_ms = [0, 300]
cue_out_range_ms = [45500, 47000]   # widened at the top in M1.3 (was 46500). The decay crosses S = -50.4 dBFS (L_int -14.38 - 36) at 25.8 s into the
                                    # tail (45.8 s); the 10 ms RMS of pink noise scatters about 4 dB, so the last run of three windows at or
                                    # above S ends up to a second later (measured 46.75 s with the 50 ms pad)
segue_range_ms = [34000, 36000]     # first pass (-12 LU) lands near 29 s; cue_out - segue > 15 s, so the -20 LU recompute (about 35 s) wins
flags = ["long_tail", "cold_start"]

[ambient]
# pink noise swelling -50 to -30 dBFS over 20 s, 20 s hold, 20 s decay to -50
duration_ms = 60000
cue_in_ms = 0
cue_out_ms = 60000
attack_range_ms = [10500, 13500]    # widened at the low end in M1.3 (was 11000): P_ref is the 95th percentile of E50 of a NOISE
                                    # plateau, -29.0 dBFS measured (noise peaks), not the nominal -30, so the attack threshold is
                                    # -37.0 dBFS and the swell reaches it about 10.7 s in; -38 dBFS would be reached at 12 s
segue_range_ms = [53000, 55000]     # CORRECTED in M1.3 from [49000, 51500]. L_int = -29.43 LUFS (ffmpeg -af ebur128: -29.4), so
                                    # T_seg = -41.43 LUFS. The K-weighted level of the -30 dBFS pink hold is -27.6 LUFS (the K shelf
                                    # adds about 2.4 dB to pink noise) and the decay is 1 dB/s from 40 s, so K200 falls to -41.43 at
                                    # 40 + 13.8 = 53.8 s (measured 53.94 s: the K200 curve is smooth here)
lra_lu_estimate = 17
flags = ["ambient_suspect"]         # LRA over 15 LU (review only; does not change the profile)

[voice_short]
# 0.2 s silence, three 400 ms 300 Hz-3 kHz noise bursts at -18 dBFS with 200 ms gaps, 0.2 s silence
duration_ms = 2000
first_sound_ms = 200
cue_in_ms = 180
cue_out_ms = 1850
burst_starts_ms = [200, 800, 1400]
flags = ["short", "cold_start"]

[liner_8s]
# 0.2 s silence, eight 600 ms bursts (200 ms gaps), a final 800 ms burst ending at 7.4 s, a 0.6 s exponential decay (-60 dB) to 8.0 s
duration_ms = 8000
first_sound_ms = 200
cue_in_ms = 180
cue_out_range_ms = [7700, 7900]     # decay crosses the ~-52 dBFS threshold 0.34 s into the 0.6 s tail
flags = ["short", "cold_start"]

[quiet_track]
# tone_fade at -30 dBFS RMS. Silence threshold clamps to -60 dBFS.
duration_ms = 26500
first_sound_ms = 500
cue_in_ms = 480
attack_ms = 500
attack_tol_ms = 20
cue_out_ms = 25390          # fade reaches -60 dBFS 158 ms before 25.5 s
segue_range_ms = [24100, 24500]
normalization_gain_db_estimate = 16   # to -18 LUFS from about -34; the peak rule allows it (M1.4 acceptance 6)
flags = ["cold_start"]

["mono.wav"]
# 44.1 kHz mono sine -20 dBFS RMS, 10 s
duration_ms = 10000
sample_rate = 44100
channels = 1
cue_in_ms = 0
cue_out_ms = 10000
flags = ["cold_start", "cold_end"]

["rate_44k.flac"]
duration_ms = 5000
sample_rate = 44100
cue_in_ms = 0
cue_out_ms = 5000

["rate_96k.flac"]
duration_ms = 5000
