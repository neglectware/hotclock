cue_in_ms = 0
cue_out_ms = 5000

["flac16.flac"]
duration_ms = 8000
bits_per_sample = 16

["corrupt.mp3"]
# tone_fade content as MP3 (128 kbit/s, 48 kHz) with 64 bytes of 0xFF over the side information of
# the first frame at or after the middle of the file
census_verdict = "decodable-with-errors"
decode_errors_min = 1

["truncated.flac"]
# tone_fade content, the file cut at 60 percent of its bytes
census_verdict = "truncated"
import = "fails with a readable error; no file in the store, no row"

[quote_unquote]
# 34 s of slow-modulated pink noise at -50 dBFS RMS (+-3 dB at 0.3 Hz) with a 0.4 s 4-12 kHz "glass"
# burst at 32.0 s (-16 dBFS RMS = P_ref - 4 dB), the "band" (pink, -12 dBFS RMS) from 34.0 s for
# 60 s, a 5 s decay to -72 dBFS
duration_ms = 99000
glass_start_ms = 32000
band_start_ms = 34000
[quote_unquote.without_override]
attack_ms = 32000           # the failure the owner described: analysis takes the glass for the attack
attack_tol_ms = 20
cue_in_max_ms = 32000       # somewhere in the snoring (the -47 dBFS threshold is crossed by its peaks)
flags = ["long_intro", "long_intro_review"]
[quote_unquote.with_ovr_cue_in_33980]
cue_in_ms = 33980
attack_ms = 33980           # cold_start: the band starts 20 ms after the cue
attack_tol_ms = 20
render_max_before_cue_dbfs = -120
cue_out_range_ms = [96500, 97200]   # decay crosses the ~-45.7 dBFS threshold 2.8 s into the 5 s tail
segue_range_ms = [94800, 95400]
flags = ["cold_start"]
not_flags = ["long_intro", "long_intro_review"]

[slowly_growing_deaf]
# pink -12 dBFS RMS to 351.0 s; a 60 ms 80 Hz kick (-6 dBFS peak) plus 150 ms of 4-12 kHz noise
# from 351.0 s, choked to exact silence at 351.3 s; 65 s of speech-band bursts at -30 dBFS
duration_ms = 416300
hit_start_ms = 351000
hit_end_ms = 351300
[slowly_growing_deaf.with_ovr_cue_out_352000]
cue_out_ms = 352000
segue_min_ms = 351000
segue_max_ms = 352000
max_cue_out_minus_segue_ms = 1000
# flags = ["cold_end"] REMOVED in M1.3: the sound is choked at 351.3 s and the override puts the cue-out at 352.0 s, so at least
# 0.7 s of silence lies between the last loud window and the cue-out; cold_end needs cue_out - segue < 300 ms, which no rule that
# finds the last loud window can give. Measured: segue 351.24 s, cue_out - segue = 760 ms (inside the 1 s limit above).
markers_independent_of_audio_after_ms = 352000   # replacing the interlude must not move any marker
[slowly_growing_deaf.without_override]
# the segue lands in the interlude (documented, not required to be "right")
segue_min_ms = 352000

["slowly_growing_deaf_t1.flac"]
# the same audio, tagged album "Fixture Album", album artist "Fixture Artist", disc 1, track 1 of 2
