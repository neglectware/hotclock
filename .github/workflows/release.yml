# Builds the release files when a version tag is pushed (for example v0.1.0):
#   hotclock_<version>-1_amd64.deb         for Ubuntu 24.04 / Debian-family systems with glibc 2.39 or newer
#   hotclock-<version>-linux-amd64.tar.gz  the binary, the packaging files and install notes, for other distributions
# Both are built on Ubuntu 24.04, so both need glibc 2.39 or newer and libasound2 at run time.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version '^3'
      - name: Build
        run: cargo build --release --locked -p hotclock
      - name: Package
        run: |
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p dist
          cargo deb -p hotclock --no-build --strip --deb-version "$V-1" -o dist/
          T="hotclock-$V-linux-amd64"
          mkdir -p "dist/$T"
          strip -o "dist/$T/hotclock" target/release/hotclock
          cp -r packaging docs LICENSE README.md INSTALL-Linux.txt "dist/$T/"
          tar -C dist -czf "dist/$T.tar.gz" "$T"
          ls -l dist
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            packaging/install.sh
